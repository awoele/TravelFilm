<!doctype html>
<html lang="zh-CN" data-model-url="models/iphone-17-pro-max-ranguel.glb">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TravelFilm Showcase · aura</title>
<meta name="description" content="TravelFilm 的35秒3D产品展示。">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a10;color:#f4f1ea;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.viewport{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:20px;background:#091326;box-shadow:0 20px 70px #0005;isolation:isolate}
.viewport:fullscreen{width:100vw;height:100vh;border-radius:0;aspect-ratio:auto;display:grid;place-items:center}
.stage{position:absolute;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#091326}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
#model-surface{position:absolute;inset:0;z-index:2;pointer-events:none}
#model-state{position:absolute;left:0;right:0;top:50%;text-align:center;font-size:22px;color:#d3d1df88;z-index:4}
.copy{position:absolute;left:210px;top:50%;transform:translateY(-50%);width:460px;z-index:3;opacity:0;pointer-events:none}
.copy[data-placement="right"]{left:auto;right:270px}
.copy[data-placement="compact-left"]{left:130px;width:330px}
.copy[data-placement="compact-right"]{left:auto;right:110px;width:350px}
.copy h2{font-size:48px;line-height:1.18;letter-spacing:-1.5px;margin:0;font-weight:500}
.copy p{font-size:26px;line-height:1.5;letter-spacing:.3px;color:#e0e3edb3;margin:20px 0 0}
.copy p:empty{display:none}
.brandmode .copy{left:280px;right:auto;width:700px}
.brandmode .copy h2{font-size:112px;letter-spacing:-4px;font-weight:600}
.brandmode .copy p{font-size:30px;letter-spacing:.5px}
.viewport{position:fixed;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;box-shadow:none;background:#080a10}
.controls{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));display:flex;gap:8px;z-index:10;transition:opacity .25s}
.controls button,.controls a{display:grid;place-items:center;width:38px;height:38px;border:1px solid #ffffff30;border-radius:50%;color:#f4f1ea;background:#080a10b3;cursor:pointer;backdrop-filter:blur(12px)}
.controls svg{width:16px;height:16px;fill:currentColor}.controls :focus-visible{outline:2px solid #ff7733;outline-offset:4px}
body.playing:not(.interacting) .controls{opacity:0}body.playing .controls:hover,body.playing .controls:focus-within{opacity:1}
#model-state{font-size:18px}body.failed #model-state{padding:20px} @media(prefers-reduced-motion:reduce){.controls{transition:none}}
</style>
<script type="module" crossorigin src="./runtime/index-sDjcCpsN.js"></script>
</head>
<body class="interacting">
<main class="viewport" id="viewport" aria-label="TravelFilm Showcase"><div class="stage" id="stage">
<div id="model-surface" aria-label="TravelFilm 3D产品展示"></div><div id="model-state" role="status">加载中…</div>
<div class="copy" id="copy"><h2 id="title"></h2><p id="subtitle"></p></div>
</div></main>
<output hidden id="perf-status"></output>
<div class="controls" aria-label="播放控制">
<button id="play" aria-label="播放" title="播放"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
<button id="immersive" aria-label="全屏观看" title="全屏观看"><svg viewBox="0 0 24 24"><path d="M3 3h7v2H5v5H3zm11 0h7v7h-2V5h-5zM3 14h2v5h5v2H3zm16 0h2v7h-7v-2h5z"/></svg></button>
<a href="models/ATTRIBUTION.md" aria-label="3D model by Ranguel, CC BY 4.0" title="3D model by Ranguel · CC BY 4.0"><svg viewBox="0 0 24 24"><path d="M11 10h2v8h-2zm0-4h2v2h-2z"/></svg></a>
</div>
<script>
'use strict';
const params=new URLSearchParams(location.search),clamp=x=>Math.max(0,Math.min(1,x));
const smootherStep=value=>{const t=clamp(value);return t*t*t*(t*(t*6-15)+10)};
const stage=document.getElementById('stage'),viewport=document.getElementById('viewport'),playButton=document.getElementById('play');
let film,frame=0,playing=false,ready=false,clockStart=0,startFrame=0,shotIndex=-1,animationId=0,queuedPlay=false;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){const scale=Math.min(viewport.clientWidth/1920,viewport.clientHeight/1080);stage.style.transform='scale('+scale+')';stage.style.left=(viewport.clientWidth-1920*scale)/2+'px';stage.style.top=(viewport.clientHeight-1080*scale)/2+'px'}
new ResizeObserver(resize).observe(viewport);
function render(f,force=false){
 if(!film)return;frame=Math.min(film.durationInFrames-1,Math.max(0,f));
 const index=film.shots.findIndex(s=>frame>=s.from&&frame<s.from+s.duration),s=film.shots[index],local=frame-s.from;
 if(index!==shotIndex||force){shotIndex=index;stage.className='stage'+(index===7?' brandmode':'');document.getElementById('title').textContent=s.caption?.text||'';document.getElementById('subtitle').textContent=s.caption?.sub||'';document.getElementById('copy').dataset.placement=s.caption?.side||'left'}
 const c=s.caption,fadeIn=c?.fadeIn??18,fadeOut=c?.fadeOut??18;
 let alpha=c?Math.min(smootherStep((local-c.start)/fadeIn),smootherStep((c.end-local)/fadeOut)):0;
 if(index===7)alpha=smootherStep(local/fadeIn);document.getElementById('copy').style.opacity=String(alpha);
 window.dispatchEvent(new CustomEvent('promo-frame',{detail:{frame,index,local,shot:s,fps:film.fps,backdrop:'flow-amethyst'}}));
}
function syncControls(){document.body.classList.toggle('playing',playing);playButton.setAttribute('aria-label',playing?'暂停':'播放');playButton.title=playing?'暂停':'播放';playButton.innerHTML=playing?'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'}
function pause(){playing=false;queuedPlay=false;cancelAnimationFrame(animationId);syncControls()}
function loop(time){if(!playing||document.hidden)return;const next=startFrame+(time-clockStart)*film.fps/1000;if(next>=film.durationInFrames){startFrame=0;clockStart=time;render(0)}else render(next);animationId=requestAnimationFrame(loop)}
function play(){if(!film)return;if(!ready){queuedPlay=true;return}if(playing)return;playing=true;startFrame=frame;clockStart=performance.now();syncControls();if(!document.hidden)animationId=requestAnimationFrame(loop)}
function seek(value){pause();render(value)}
playButton.addEventListener('click',()=>playing?pause():play());
window.addEventListener('promo-model-ready',()=>{ready=true;render(frame,true);if(queuedPlay)play()});
window.addEventListener('promo-model-error',()=>{pause();document.body.classList.add('failed')});
document.addEventListener('visibilitychange',()=>{if(!playing)return;cancelAnimationFrame(animationId);startFrame=frame;clockStart=performance.now();if(!document.hidden)animationId=requestAnimationFrame(loop)});
document.getElementById('immersive').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(viewport.requestFullscreen)await viewport.requestFullscreen()}catch{}});
let hideTimer;function reveal(){document.body.classList.add('interacting');clearTimeout(hideTimer);hideTimer=setTimeout(()=>document.body.classList.remove('interacting'),2000)}
document.addEventListener('pointermove',reveal);document.addEventListener('pointerdown',reveal);
document.addEventListener('keydown',e=>{if(['BUTTON','A'].includes(e.target.tagName))return;reveal();if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight'){e.preventDefault();seek(frame+30)}if(e.code==='ArrowLeft'){e.preventDefault();seek(frame-30)}});
fetch('shotlist.json').then(r=>{if(!r.ok)throw Error('展示加载失败');return r.json()}).then(data=>{film=data;resize();const initial=Number(params.get('frame')??(reduced?1020:0));render(Number.isFinite(initial)?initial:0);if(!reduced&&params.get('autoplay')!=='0')play();reveal()}).catch(e=>{document.getElementById('model-state').textContent=e.message});
</script>
</body></html>
